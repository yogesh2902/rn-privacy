name: action
on:
  push:
    branches: [main]
  pull_request:
jobs:
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # for the PR comment test below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm pack --pack-destination "$RUNNER_TEMP"
      - run: |
          for kind in good missing invalid; do node test/fixtures/make-app.mjs "$RUNNER_TEMP/$kind" "$kind"; done
          echo "TARBALL=$(ls "$RUNNER_TEMP"/rn-privacy-*.tgz)" >> "$GITHUB_ENV"

      - name: Passing app
        id: good
        uses: ./
        with:
          project-path: ${{ runner.temp }}/good
          version: ${{ env.TARBALL }}

      - name: App missing a category
        id: missing
        uses: ./
        with:
          project-path: ${{ runner.temp }}/missing
          version: ${{ env.TARBALL }}
          fail-on-error: 'false'
          summary: 'false'
          annotations: 'false'
          comment: 'false'

      - name: App with an invalid reason
        id: invalid
        uses: ./
        with:
          project-path: ${{ runner.temp }}/invalid
          version: ${{ env.TARBALL }}
          fail-on-error: 'false'
          summary: 'false'
          annotations: 'false'
          comment: 'false'

      # A real pull request comment: posted, read back, then deleted so it leaves no clutter.
      # Pull requests from forks get a read-only token, so this only runs for branches of this repo.
      - name: PR comment
        id: comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: ./
        with:
          project-path: ${{ runner.temp }}/missing
          version: ${{ env.TARBALL }}
          fail-on-error: 'false'
          summary: 'false'
          annotations: 'false'

      - name: Check and delete the test comment
        if: steps.comment.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.comment.outputs.comment-id }}
          REPO: ${{ github.repository }}
        run: |
          test -n "$ID" || { echo "::error::No comment was posted"; exit 1; }
          body="$(gh api "repos/$REPO/issues/comments/$ID" --jq .body)"
          echo "$body"
          echo "$body" | grep -q "rn-privacy: privacy manifest needs attention"
          echo "$body" | grep -q "Missing required reason API: Disk space"
          gh api -X DELETE "repos/$REPO/issues/comments/$ID"

      - name: Check results
        env:
          GOOD: ${{ steps.good.outputs.result }}
          MISSING: ${{ steps.missing.outputs.result }}
          INVALID: ${{ steps.invalid.outputs.result }}
        run: |
          echo "good=$GOOD missing=$MISSING invalid=$INVALID"
          test "$GOOD" = pass && test "$MISSING" = fail && test "$INVALID" = fail
