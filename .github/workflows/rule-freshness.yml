name: rule-freshness
# Weekly: are the SDK rules still current? Compares the newest privacy manifests SDK vendors publish
# (npm releases and the GitHub files the rules link to) with scripts/rules-baseline.json, and checks
# that vendor links still exist. Opens or updates one issue when something needs a review.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Compare with the baseline
        id: fresh
        run: |
          set +e
          node scripts/rule-freshness.mjs --out freshness.md
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then exit 1; fi
          echo "review=$([ "$code" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -f freshness.md ] && cat freshness.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Open or update the review issue
        if: steps.fresh.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create rule-freshness --color FBCA04 --description "SDK rules to review" --force
          number=$(gh issue list --label rule-freshness --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file freshness.md
            gh issue comment "$number" --body "Updated by the weekly check on $(date -u +%Y-%m-%d)."
          else
            gh issue create --title "SDK rules to review" --label rule-freshness --body-file freshness.md
          fi
