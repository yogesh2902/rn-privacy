name: rn-privacy check
description: Catch App Store privacy rejections (ITMS-91053, ITMS-91056, ITMS-90683) in React Native and Expo apps before you upload.
author: yogesh2902
branding:
  icon: shield
  color: green

inputs:
  project-path:
    description: Folder of the app (the one with package.json). Run your package install first.
    default: .
  version:
    description: rn-privacy version to run (for example 0.2.0). Defaults to the latest release.
    default: latest
  fail-on-error:
    description: Fail the job when the privacy manifest is missing something or is invalid.
    default: 'true'
  summary:
    description: Write the result and the store privacy answers to the job summary.
    default: 'true'
  annotations:
    description: Show problems as error and warning annotations on the pull request.
    default: 'true'
  comment:
    description: "On pull requests, post the result as a comment, updated on every push. Needs the pull-requests: write permission."
    default: 'true'
  github-token:
    description: Token used to comment on the pull request.
    default: ${{ github.token }}

outputs:
  result:
    description: pass or fail
    value: ${{ steps.check.outputs.result }}
  privacy-changes:
    description: true when the dependencies changed what must be declared since privacy-snapshot.json
    value: ${{ steps.check.outputs.privacy-changes }}
  comment-id:
    description: ID of the pull request comment, when one was posted or updated
    value: ${{ steps.check.outputs.comment-id }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        INPUT_PROJECT: ${{ inputs.project-path }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_FAIL: ${{ inputs.fail-on-error }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_PROJECT_LABEL: ${{ inputs.project-path }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: bash "$GITHUB_ACTION_PATH/action/run.sh"
